name: Release

# 任务书 §11.8 发布链：tag 驱动、全自动、发布前核对
#   Git tag = versionName = APK versionName = CHANGELOG 版本 = Release 标题版本
# 产物：签名 Release APK + SHA-256SUMS + 签名证书指纹 + SBOM（CycloneDX）+ 构建 provenance。
# Beta 一律 prerelease=true（稳定更新通道不得返回 Beta）。
on:
  push:
    tags: ['v*']

permissions:
  contents: write        # 创建 Release 与上传资产
  id-token: write        # attest-build-provenance 生成 OIDC provenance
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # ① 五处版本一致性核对（不一致直接失败，不产出任何资产）
      - name: 核对 tag / versionName / CHANGELOG 一致性
        run: python tools/check_release_consistency.py "${GITHUB_REF_NAME}"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          gradle-version: "8.7"

      # ② 解码签名材料（Secrets，不入库）：keystore + keystore.properties
      - name: 还原签名材料
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p toolchain/keys
          echo "$KEYSTORE_BASE64" | base64 -d > toolchain/keys/zcode-remote.keystore
          printf '%s' "$KEYSTORE_PROPERTIES" > app-android/keystore.properties

      - name: 组装签名 Release APK + SBOM
        working-directory: app-android
        run: gradle assembleRelease cyclonedxBom --console=plain

      # ③ 发布资产：APK 规范化命名 + SHA-256 + 签名证书指纹
      - name: 生成校验与指纹资产
        run: |
          set -euo pipefail
          APK=app-android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::未产出签名 APK，release 输出目录："
            ls -la app-android/app/build/outputs/apk/release/ || true
            echo "（若只有 *-unsigned.apk，说明 keystore.properties 未生效）"
            exit 1
          fi
          cp "$APK" "ZCodeRemote-${GITHUB_REF_NAME#v}.apk"
          sha256sum "ZCodeRemote-${GITHUB_REF_NAME#v}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -f app-android/app/build/reports/bom.json || { echo "::error::未产出 SBOM"; exit 1; }
          cp app-android/app/build/reports/bom.json sbom.cdx.json

          # 签名证书指纹：直接读 keystore（keytool 随 JDK 恒在，比解析 apksigner 输出稳定；
          # 早期写法 `apksigner ... | grep` 在 set -e 下会静默退出导致整步失败）。
          # tr -d '\r'：keystore.properties 源自 Windows（CRLF），Java Properties 容忍 \r，
          # 但 shell 变量会把它带进口令 → keytool 报 "password was incorrect" 且无输出。
          STORE_PASS="$(grep '^storePassword=' app-android/keystore.properties | cut -d= -f2- | tr -d '\r')"
          KEY_ALIAS="$(grep '^keyAlias=' app-android/keystore.properties | cut -d= -f2- | tr -d '\r')"
          keytool -list -v -keystore toolchain/keys/zcode-remote.keystore \
            -storepass "$STORE_PASS" -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -E "SHA256:|SHA1:" > certificate-fingerprints.txt || true
          if [ -s certificate-fingerprints.txt ]; then
            cat certificate-fingerprints.txt
          else
            echo "::warning::未取到证书指纹（不阻断发布）"
            echo "（keytool 未输出摘要）" > certificate-fingerprints.txt
          fi

      # ④ 构建来源证明（SLSA provenance，绑定本次 workflow 与产物摘要）
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: ZCodeRemote-*.apk

      # ⑤ 创建 prerelease：标题 = `tag: 中文摘要`（取自 CHANGELOG 头条），正文 = CHANGELOG 该版本正文
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 幂等短路：同一 tag 触发两个 Release 工作流时，后者会因 Release 已存在而必失败——先查再建
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过创建"
            exit 0
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --prerelease --verify-tag \
            --title "$(cat _release_meta/title.txt)" \
            --notes-file _release_meta/notes.md \
            "ZCodeRemote-${GITHUB_REF_NAME#v}.apk" \
            SHA256SUMS.txt \
            certificate-fingerprints.txt \
            sbom.cdx.json

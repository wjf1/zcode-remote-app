name: CI

# Sprint 6 · 回归网：这个项目的协议是逆向的、上游一改就可能碎 —— CI 变红 =
# 「协议被上游打破」的最早信号（而不是某天手机没通知才发现）。全部纯 JVM，
# 不需要真机/模拟器。
#
# §11.8 阶段 6：Actions 加固（最小权限 / 固定 SHA / timeout / concurrency）、
# 静态分析（Detekt 带基线 / Kover 覆盖率报告；KtLint 存量噪音专项治理后接入，见 HANDOVER）、
# 仪器化回归网进 CI（emulator：C-14 布局 + Markdown 渲染）。
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      # 金标准对拍：Python 侧独立编解码实现生成共享向量（Kotlin Vql.kt 逐一比对）
      - name: 生成 VQL 对拍 fixture
        run: python tools/gen_vql_fixtures.py

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          gradle-version: "8.7"

      - name: JVM 单元测试（VQL 对拍 + 纯函数）+ 组装 debug
        run: gradle testDebugUnitTest assembleDebug --console=plain
        working-directory: app-android

      # 第一层门禁（任务书 §11.8）：lint 双变体 0 error。真实缺陷由 lint 抓出——
      # Vql.kt 曾用 API 33 才有的 ByteArrayOutputStream#writeBytes（minSdk 31 →
      # Android 12/12L 上会 NoSuchMethodError 崩溃），已修为等价 write(byte[])。
      - name: lint（debug + release，0 error 门禁）
        run: gradle lintDebug lintRelease --console=plain
        working-directory: app-android

      # §11.8 第二层：静态分析（Detekt/KtLint 均带 baseline——存量告警登记在案、
      # 新增违规即红；Kover 覆盖率先出报告不做硬阈值，随回归网扩展再收紧）。
      - name: Detekt 静态分析（带 baseline）
        run: gradle detekt --console=plain
        working-directory: app-android

      - name: Kover 覆盖率报告
        run: gradle koverHtmlReport koverLog --console=plain
        working-directory: app-android

      # 防呆：@Test 若被注释掉或与注释粘连，JUnit 会静默跳过、构建照样全绿
      # （2026-10-07 实际发生过一次：测试数从 39 悄悄掉到 38）。做集合比对，丢用例即失败。
      # --min 260：阈值兜底，挡住「整文件/整类被删」的数量级回退（集合比对管不住）。
      # 数值随每轮新增用例上调（beta33：244；beta34：+9=253，含跳过式压力测试 1 项；beta35：+7=260）。
      - name: 断言「声明的 @Test 全部被执行」+ 数量下限
        run: python tools/check_test_count.py --min 260

      # C-2：UI 层不得出现底层自造英文错误串（必须经 UserFacingError.map() 映射后才能展示）。
      # 这些字面量只允许存在于 relay/ 协议层（错误消息源）与映射表本身；
      # 一旦有人在 UI 界面层直出，这里立刻变红（映射行为由 UserFacingErrorTest 单测覆盖）。
      - name: 断言 UI 层不出现裸英文错误串（C-2）
        run: |
          cd app-android/app/src/main/java/com/zcode/remote
          if grep -rn --include="*.kt" \
              -e "bridge not ready" \
              -e "timeout after" \
              -e "bridge re-established" \
              -e "channel reset" \
              ui/ MainActivity.kt; then
            echo "::error::UI 层出现底层英文错误串，须经 UserFacingError.map() 映射后再展示"
            exit 1
          fi
          echo "✓ UI 层无裸英文错误串"

      # P0-C 红线补充（任务书 §5 决策项建议）：ZLog.e 在 release 仍输出（proguard 只剥离 d/i/w），
      # 约定「e 只写元信息」。断言第二参数必须是字符串字面量开头——变量（payload/content/data…）一律拒绝。
      - name: 断言 ZLog.e 不携带 payload（P0-C 红线）
        run: |
          cd app-android/app/src/main/java/com/zcode/remote
          if grep -rn --include="*.kt" -E 'ZLog\.e\([A-Za-z_][A-Za-z0-9_]*,[[:space:]]*[a-z_]' .; then
            echo "::error::ZLog.e 第二参数不是字符串字面量——release 仍输出，禁止携带 payload / 正文 / 凭据"
            exit 1
          fi
          echo "✓ ZLog.e 调用点均只写元信息"

      - name: 组装 release（P0 安全止血门禁）
        run: gradle assembleRelease --console=plain
        working-directory: app-android

      # P0 传输/日志止血（任务书 §11.3.2）：Release 产物必须
      # ① 关闭明文流量 ② 不含任何 debug 组件 ③ debuggable=false。
      # 直接对 release APK 的二进制 AndroidManifest 做断言（merged manifest 路径随 AGP 版本漂移，
      # 对最终产物断言最稳）。
      - name: 断言 Release 产物安全门禁（明文关停 / 无 debug 组件 / 不可调试）
        run: |
          set -euo pipefail
          APK=app-android/app/build/outputs/apk/release/app-release-unsigned.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          AAPT2="$(ls -d "$SDK"/build-tools/*/aapt2 | tail -1)"
          DUMP="$("$AAPT2" dump xmltree --file AndroidManifest.xml "$APK")"
          if ! echo "$DUMP" | grep -qE 'usesCleartextTraffic\(0x[0-9a-fA-F]+\)=false'; then
            echo "::error::Release 未关闭明文流量（usesCleartextTraffic 非 false）"; exit 1
          fi
          if echo "$DUMP" | grep -qiE 'DebugPairReceiver|DebugApprovalReceiver|DebugInjectionGuard'; then
            echo "::error::Release 产物含 debug 组件"; exit 1
          fi
          if echo "$DUMP" | grep -qiE 'debuggable\(0x[0-9a-fA-F]+\)=true'; then
            echo "::error::Release 产物可调试（debuggable=true）"; exit 1
          fi
          echo "✓ Release 产物：明文关停、无 debug 组件、不可调试"

      - name: 汇总测试结果
        if: always()
        run: |
          find app-android/app/build/test-results -name "*.xml" 2>/dev/null | head -20
          grep -h "tests=" app-android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -20

  # §11.8 第二层：仪器化回归网进 CI（此前只能本机模拟器/真机跑——本机兆芯 CPU 无
  # 虚拟化扩展，ubuntu runner 自带 KVM）。覆盖 C-14 顶栏布局与 Markdown 渲染两张网。
  instrumentation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@8379f6a1328ee0e06e2bb424dadb7b159856a326 # v4.4.0
        with:
          gradle-version: "8.7"

      - name: 组装 debug 与 androidTest APK
        run: gradle assembleDebug assembleDebugAndroidTest --console=plain
        working-directory: app-android

      # 官方要求的前置步骤（android-emulator-runner README「Enable KVM group perms」）：
      # GitHub-hosted Linux runner 上 runner 用户默认不在 kvm 组，/dev/kvm 不可用 →
      # action 会把 `disable-linux-hw-accel` 判为 true 并以 `-accel off` 启动（纯软件模拟），
      # 结果 adb 永远等不到设备、任务必然失败（2026-10-11 beta32 落地后连续多次 CI 红的根因，
      # 证据：失败日志 `ProbeKVM: This user doesn't have permissions to use KVM (/dev/kvm)`）。
      - name: 启用 KVM（udev 规则给 /dev/kvm 放开权限）
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: cd app-android && gradle connectedDebugAndroidTest --console=plain

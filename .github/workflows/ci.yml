name: CI

# Sprint 6 · 回归网：这个项目的协议是逆向的、上游一改就可能碎 —— CI 变红 =
# 「协议被上游打破」的最早信号（而不是某天手机没通知才发现）。全部纯 JVM，
# 不需要真机/模拟器。
on:
  push:
    branches: [master]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 金标准对拍：Python 侧独立编解码实现生成共享向量（Kotlin Vql.kt 逐一比对）
      - name: 生成 VQL 对拍 fixture
        run: python tools/gen_vql_fixtures.py

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: JVM 单元测试（VQL 对拍 + 纯函数）+ 组装 debug
        run: gradle testDebugUnitTest assembleDebug --console=plain
        working-directory: app-android

      # 防呆：@Test 若被注释掉或与注释粘连，JUnit 会静默跳过、构建照样全绿
      # （2026-10-07 实际发生过一次：测试数从 39 悄悄掉到 38）。做集合比对，丢用例即失败。
      - name: 断言「声明的 @Test 全部被执行」
        run: python tools/check_test_count.py

      # C-2：UI 层不得出现底层自造英文错误串（必须经 UserFacingError.map() 映射后才能展示）。
      # 这些字面量只允许存在于 relay/ 协议层（错误消息源）与映射表本身；
      # 一旦有人在 UI 界面层直出，这里立刻变红（映射行为由 UserFacingErrorTest 单测覆盖）。
      - name: 断言 UI 层不出现裸英文错误串（C-2）
        run: |
          cd app-android/app/src/main/java/com/zcode/remote
          if grep -rn --include="*.kt" \
              -e "bridge not ready" \
              -e "timeout after" \
              -e "bridge re-established" \
              -e "channel reset" \
              ui/ MainActivity.kt; then
            echo "::error::UI 层出现底层英文错误串，须经 UserFacingError.map() 映射后再展示"
            exit 1
          fi
          echo "✓ UI 层无裸英文错误串"

      - name: 汇总测试结果
        if: always()
        run: |
          find app-android/app/build/test-results -name "*.xml" 2>/dev/null | head -20
          grep -h "tests=" app-android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -20

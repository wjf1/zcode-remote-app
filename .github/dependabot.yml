# 任务书 §11.8：依赖与 Actions 版本自动跟进（升级 PR 由人工 review 后合入）
version: 2
updates:
  - package-ecosystem: gradle
    directory: /app-android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 稳定优先（AGENTS.md）：大版本跳跃不自动开 PR（仍会出现在 Dependabot alerts 里），
    # 需要人工评估兼容性后手动升级；自动 PR 只收 minor/patch。
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # ⚠️ Kotlin 生态整体冻结在 Kotlin 2.0.20（HANDOVER 坑 14）：凡是 **用 Kotlin 2.1+
      # 编译的依赖，其 .kotlin_module 元数据版本高于本项目编译器可读的 2.0，会硬报
      # "Module was compiled with an incompatible version of Kotlin"**。已实测踩中两类：
      #   ① `org.jetbrains.kotlin.plugin.serialization 2.0.20 → 2.4.21`（PR#11，且只升单个
      #      插件会造成三个 Kotlin 官方插件版本不一致）——semver 上属 minor，绕过上面的
      #      semver-major 过滤 → 必须显式 ignore；
      #   ② `kotlinx-coroutines 1.8.1 → 1.11.0`（PR#3，2026-10-13 本地实测：1.11.0 用
      #      Kotlin 2.2.20 编译，元数据 2.2.0 ≠ 期望 2.0.0 → compileDebugKotlin/compileReleaseKotlin
      #      双双 FAILED）。
      # 另：`com.mikepenz:multiplatform-markdown-renderer 0.27.0` 是最后一个 Kotlin 2.0.x
      # 编译版（0.30.0 起改 Kotlin 2.1+），锁死 Kotlin 版本即锁死它。
      # 结论：kotlin 系与 kotlinx 系（含 coroutines / serialization）一律不自动升级；
      # 需要升级时单独立项——同步全部 Kotlin 插件 + 评估 markdown 渲染库替代 + 全量回归。
      - dependency-name: "org.jetbrains.kotlin*"
      - dependency-name: "org.jetbrains.kotlinx*"
      # markdown 渲染库同样是「Kotlin 版本绑定」依赖：0.27.0 是最后一个 Kotlin 2.0.x 编译版，
      # 而 0.27.0 → 0.45.0 在 semver 上属 **minor**（0.x 语义），会绕过上面的 semver-major
      # 过滤——2026-10-14 Dependabot 定时任务正是据此开出了 PR#17（已拒绝）。
      - dependency-name: "com.mikepenz:multiplatform-markdown-renderer*"
      # Gradle wrapper 未被本项目使用（CI 5 处显式 `gradle-version: "8.7"`、本地用
      # `toolchain/gradle-8.7`，无人调 `./gradlew`）——只升 wrapper 文件会造成「仓库声明 8.14.6
      # vs 实际执行 8.7」的死配置漂移（2026-10-14 PR#18 已拒绝）。Gradle 升级须与
      # toolchain/ + CI 的 gradle-version 同步改，并做 AGP 兼容评估。
      - dependency-name: "gradle-wrapper"
      # Android Gradle Plugin（AGP）与 Gradle 版本强耦合，不能单独升：AGP 8.13 需要更新的
      # Gradle，而本项目 Gradle 钉 8.7（CI 5 处 + toolchain/）；单独升 AGP 会波及全部构建
      # 配置、发布链、静态分析门禁行为与 benchmark 模块（2026-10-14 PR#21 8.5.2→8.13.2 已拒绝）。
      # 升级须作为专项：AGP + Gradle（toolchain 与 CI）+ wrapper 同步改 + 通读 breaking changes
      # + 全量回归。
      - dependency-name: "com.android.application"
      - dependency-name: "com.android.library"
      - dependency-name: "com.android.tools.build:gradle"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
